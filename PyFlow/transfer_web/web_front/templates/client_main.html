<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyFlow TCP Client</title>
  <link rel="stylesheet" href="/static/common.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>PyFlow TCP Client</h1>
        <div class="meta" id="server-meta">connecting...</div>
        <div class="sidebar-actions">
          <button class="btn btn-ghost" id="reload-btn" title="Reload instance list">&#8635; Reload</button>
          <button class="btn btn-ghost" id="contacts-btn" title="Search and add contacts">&#128101; Contacts</button>
          <button class="btn btn-ghost" id="requests-btn" title="Pending contact requests">&#9993; Requests<span id="requests-count"></span></button>
          <button class="btn btn-ghost" id="user-info-btn" title="Your account">&#128100; User info</button>
          <button class="btn btn-ghost" id="add-ext-btn" title="Add an extension protocol file">+ Extension</button>
          <button class="btn btn-ghost" id="ftp-btn" title="Browse the folder the server shares and download what you pick">View server "ftp"</button>
          <a class="btn btn-ghost" href="/config" title="Change service startup configuration">&#9881; Change Config</a>
          <button class="btn btn-ghost" id="logout-btn" title="Log out">&#9099; Log out</button>
        </div>
      </div>
      <div class="instance-list" id="instance-list"></div>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>
    <main class="main">
      <div class="main-topbar">
        <span class="title" id="target-title">Select a target</span>
        <span class="spacer"></span>
        <span class="conn" id="conn-indicator">connecting...</span>
      </div>
      <div class="chat-area" id="chat-area">
        <div class="empty-hint" id="empty-hint">Connected. Select the server or a client on the left to send messages, files or folders.<br><br>Messages to other clients are forwarded through the server.</div>
      </div>
      <div class="input-box">
        <div class="row">
          <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
          <button class="btn" id="send-btn">Send</button>
        </div>
        <div class="icon-bar" id="icon-bar">
          <button class="icon-btn" id="file-btn" title="Send file(s)">&#128193;</button>
          <button class="icon-btn" id="folder-btn" title="Send folder">&#128194;</button>
          <button class="icon-btn" id="plus-btn" title="Add an extension protocol">+</button>
          <span class="hint" id="icon-hint"></span>
        </div>
      </div>
    </main>
  </div>
  <script>
    window.WEB_MODE = "{{ mode }}";
    window.WEB_USER = {{ user|tojson }};
  </script>
  <script src="/static/common.js"></script>
  <script src="/static/client_account.js"></script>
  <script>
    PyFlowClientAccount.mount({ user: window.WEB_USER });
  </script>
</body>
</html>
