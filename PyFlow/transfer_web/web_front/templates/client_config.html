<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyFlow TCP Client Setup</title>
  <link rel="stylesheet" href="/static/common.css">
</head>
<body>
  <div class="center-wrap">
    <div class="card">
      <h1>PyFlow TCP Client Setup</h1>
      <p class="subtitle">Configure the TCP client. Every parameter has a default value; change only what you need.</p>
      <form id="config-form" class="form-grid">
        {% for key, label, ftype, default, help in fields %}
        <div class="field">
          <label for="f-{{ key }}">{{ label }}</label>
          {% if ftype == "bool" %}
          <div class="checkbox-row">
            <input type="checkbox" id="f-{{ key }}" data-key="{{ key }}" data-type="bool"
                   {% if default %}checked{% endif %}>
            <span class="help">{{ help }}</span>
          </div>
          {% else %}
          <input type="{{ ftype }}" id="f-{{ key }}" data-key="{{ key }}" data-type="{{ ftype }}"
                 value="{{ default }}" {% if ftype == "number" %}step="any"{% endif %}>
          <div class="help">{{ help }}</div>
          {% endif %}
        </div>
        {% endfor %}
        <div class="actions full">
          <button type="submit" class="btn" id="save-btn">Save &amp; Restart Client</button>
          <span class="status-line" id="status"></span>
        </div>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById("config-form");
    const status = document.getElementById("status");
    const saveBtn = document.getElementById("save-btn");

    async function currentPid() {
      try {
        const r = await fetch("/api/status");
        return (await r.json()).pid;
      } catch (e) {
        return null;
      }
    }

    async function waitForRestart(oldPid) {
      // Poll until a new process (different pid) answers, then navigate.
      for (let i = 0; i < 40; i++) {
        try {
          const r = await fetch("/api/status");
          const d = await r.json();
          if (d.pid && d.pid !== oldPid) {
            location.href = "/";
            return;
          }
        } catch (e) { /* old process gone or not up yet */ }
        await new Promise((res) => setTimeout(res, 500));
      }
      location.href = "/";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      status.className = "status-line";
      status.textContent = "Saving configuration and restarting the TCP client...";
      const oldPid = await currentPid();
      const params = {};
      form.querySelectorAll("[data-key]").forEach((el) => {
        const key = el.dataset.key;
        const type = el.dataset.type;
        let value;
        if (type === "bool") {
          value = el.checked;
        } else if (type === "number") {
          value = el.value === "" ? null : Number(el.value);
        } else {
          value = el.value;
        }
        params[key] = value;
      });
      try {
        const resp = await fetch("/api/save_config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ params }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          status.className = "status-line err";
          status.textContent = "Failed: " + (data.error || resp.status);
          saveBtn.disabled = false;
          return;
        }
        if (data.restarting) {
          status.className = "status-line ok";
          status.textContent = "Configuration saved, restarting...";
          await waitForRestart(oldPid);
          return;
        }
        status.className = "status-line ok";
        status.textContent = "Configuration saved, reconnecting...";
        setTimeout(() => { location.href = "/"; }, 800);
      } catch (err) {
        status.className = "status-line err";
        status.textContent = "Failed: " + err.message;
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
