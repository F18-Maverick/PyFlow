name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        # Source distribution only: the C library is compiled on the user's
        # machine when pip builds the wheel from it (setup.py). A wheel built
        # here would be a raw linux_x86_64 binary linked against this runner's
        # glibc/OpenSSL, which is neither portable nor installable on
        # Windows/macOS. Publishing prebuilt manylinux/macosx/win wheels needs a
        # cibuildwheel matrix (with auditwheel/delvewheel) instead.
        run: python -m build --sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
