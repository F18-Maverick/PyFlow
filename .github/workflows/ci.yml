name: CI

on: [push, pull_request]

jobs:
  C_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev build-essential
      - name: Build C code
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile C code
        run: cmake --build build --parallel
      - name: Run C tests
        run: ctest --test-dir build --output-on-failure
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2
    - name: Run Ruff linter on Python code
      uses: astral-sh/ruff-action@v4.0.0
      with:
        args: "check"
      continue-on-error: true
    - name: Check code formatting
      uses: astral-sh/ruff-action@v4.0.0
      with:
        args: "format --check"
      continue-on-error: true

  TypeCheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Run ty
        run: uvx ty check
        continue-on-error: true

  Test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev build-essential
      - name: Setup Windows toolchain
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@v1
      - name: Install CMake (Win)
        if: runner.os == 'Windows'
        uses: step-security/get-cmake@v4

      - name: Cache C build
        id: cache-build
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'PyFlow/crypto_api/**/*.c', 'PyFlow/crypto_api/include/**/*.h') }}
      - name: Build C lib
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRYPTO_API_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel

      - name: Copy OpenSSL DLLs (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /r "C:\Program Files\OpenSSL" %%f in (libcrypto*.dll) do copy "%%f" build\Release\

      - name: Install Python deps
        run: uv sync --group dev
      - name: Run pytest
        run: uv run pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Installing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev build-essential
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest pytest-cov
      - name: building the C lib
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Run pytest converage
        run: pytest --cov=./PyFlow --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
