name: CI

on: [push, pull_request]

jobs:
  C_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache C build
        id: cache-build
        uses: actions/cache@v6
        with:
          path: build
          key: ctest-${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'PyFlow/crypto_api/**/*.c', 'PyFlow/crypto_api/include/**/*.h') }}
      - name: Build C code
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Run C tests
        run: ctest --test-dir build --output-on-failure
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Run Ruff linter on Python code
      uses: astral-sh/ruff-action@v4.1.0
      with:
        args: "check"
      continue-on-error: true
    - name: Check code formatting
      uses: astral-sh/ruff-action@v4.1.0
      with:
        args: "format --check"
      continue-on-error: true

  TypeCheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Run ty
        run: uvx ty check
        continue-on-error: true

  Test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache C build
        id: cache-build
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'PyFlow/crypto_api/**/*.c', 'PyFlow/crypto_api/include/**/*.h') }}
      - name: Build C lib
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRYPTO_API_BUILD_TESTS=OFF -G "Visual Studio 17 2022" -A x64
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRYPTO_API_BUILD_TESTS=OFF
          fi
          cmake --build build --config Release --parallel

      - name: Copy OpenSSL DLLs (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /r "C:\Program Files\OpenSSL" %%f in (libcrypto*.dll) do copy "%%f" build\Release\

      - name: Install Python deps
        run: uv sync --group dev
      - name: Run pytest (non-coverage)
        if: matrix.python-version != '3.14' || runner.os != 'Linux'
        run: uv run pytest

      - name: Run pytest with coverage (linux 3.14 only)
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: uv run pytest --cov=./PyFlow --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
