[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflow-net"
version = "0.5.0"
description = "PyFlow is a high-level network protocol with APIs for transferring messages, files, and folders, plus extensible interfaces etc.."
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]
authors = [
  { name="F18-Maverick", email="rayxu2333@outlook.com" },
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
include = ["PyFlow*"]

[dependency-groups]
dev = [
    "deep-translator>=1.11.4",
    "polib>=1.2.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "sphinx>=8.1.3",
    "sphinx-intl>=2.3.2",
]

[project.optional-dependencies]
docs = [
    "deep-translator",
    "polib",
    "sphinx>=8.1.3",
    "sphinx-intl>=2.3.2",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build/", "dist/", ".git/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "PL", "I", "D"]
# Docstring rules follow docs/source/DOCSTRING_GUIDE.md (Google style): the NumPy section rules and
# the two mutually exclusive pairs are dropped, everything else stays on.
ignore = [
    "D203", # blank line before a class docstring; conflicts with D211 (Google has none)
    "D213", # summary on the second line; conflicts with D212 (Google puts it on the first)
    "D406", # NumPy section formatting rules
    "D407",
    "D408",
    "D409",
    "D410",
    "D411",
    "D413",
    "D414",
]

[tool.ruff.lint.per-file-ignores]
# Tests are not public API: the guide lets internal callables go undocumented.
"test/**" = ["D1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = ["test/"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.interrogate]
# Coverage ratchet for the public API. Raise fail-under as docstrings get written; never lower it.
fail-under = 65.0
style = "google"
ignore-private = true # guide section 5: underscore-prefixed helpers may stay undocumented
ignore-semiprivate = true
exclude = ["test", "docs", "build", "dist", ".venv"]
verbose = 0
