[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflow-net"
version = "0.1.1"
description = "PyFlow is a high-level network protocol with APIs for transferring messages, files, and folders, plus extensible interfaces etc.."
requires-python = ">=3.10"
dependencies = []
authors = [
  { name="F18-Maverick", email="rayxu2333@outlook.com" },
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Networking",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
include = ["PyFlow*"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build/", "dist/", ".git/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "PL", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = ["test/"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--ignore=test/test_instance_setup"
