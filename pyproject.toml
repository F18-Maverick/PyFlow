[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflow"
version = "0.1.0"
description = "PyFlow is a high-level network protocol with APIs for transferring messages, files, and folders, plus extensible interfaces etc.."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["PyFlow*"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build/", "dist/", ".git/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "PL", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = ["test/"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--ignore=test/test_instance_setup"
